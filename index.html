<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0b14">
<title>Lector — Reading Notes</title>
<style>
:root{
  --bg:#0d0b14;
  --bg2:#15121f;
  --card:#1b1726;
  --card2:#231d33;
  --line:#2e2742;
  --ink:#ece8f6;
  --ink2:#9a92b3;
  --ink3:#655d80;
  --accent:#6c3ce1;
  --accent2:#8b63ec;
  --accent-soft:rgba(108,60,225,.16);
  --good:#3ddc97;
  --warn:#f5a623;
  --bad:#ef5466;
  --r:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(60vw 40vh at 85% -5%,rgba(108,60,225,.22),transparent 65%),
    radial-gradient(50vw 35vh at -10% 100%,rgba(108,60,225,.10),transparent 60%),
    var(--bg);
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:rgba(13,11,20,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex;align-items:center;gap:10px}
.brand{font-size:1.15rem;font-weight:700;letter-spacing:.4px}
.brand b{color:var(--accent2);font-weight:800}
.hbtns{margin-left:auto;display:flex;gap:8px}
.icobtn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);font-size:1rem;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icobtn:active{background:var(--card2)}
#searchwrap{display:none;margin-top:10px}
#searchwrap.open{display:block}
#search{
  width:100%;padding:10px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font-size:1rem;outline:none;
  font-family:inherit;
}
#search:focus{border-color:var(--accent)}

/* ---------- tabs ---------- */
nav.tabs{
  display:flex;gap:4px;margin-top:10px;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;
}
nav.tabs button{
  flex:1;padding:8px 0;border:0;border-radius:9px;background:transparent;
  color:var(--ink2);font-size:.86rem;font-weight:600;font-family:inherit;cursor:pointer;
}
nav.tabs button.on{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(108,60,225,.45)}

/* ---------- layout ---------- */
main{padding:16px 16px calc(96px + var(--safe-bot))}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:.85rem;margin-bottom:12px}
.crumb button{background:none;border:0;color:var(--accent2);font:inherit;font-weight:600;cursor:pointer;padding:0}
.crumb span.sep{color:var(--ink3)}
h2.vtitle{font-size:1.3rem;font-weight:700;margin-bottom:4px}
p.vsub{color:var(--ink2);font-size:.85rem;margin-bottom:14px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:10px;
}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--card2)}
.bookcard{display:flex;gap:12px;align-items:center}
.cover{
  width:52px;height:74px;flex:none;border-radius:8px;overflow:hidden;
  background:linear-gradient(160deg,var(--accent),#3a2275);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:800;color:rgba(255,255,255,.85);
  border:1px solid var(--line);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.bmeta{min-width:0;flex:1}
.btitle{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bauthor{color:var(--ink2);font-size:.82rem;margin-top:2px}
.bcount{color:var(--ink3);font-size:.76rem;margin-top:5px}
.chev{color:var(--ink3);font-size:1.1rem}

.notetxt{font-size:.93rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.notemeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
.stamp{color:var(--ink3);font-size:.72rem;margin-left:auto}
.notesrc{color:var(--ink3);font-size:.74rem;margin-top:6px}

.tag{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600;
  background:var(--accent-soft);color:var(--accent2);border:1px solid rgba(108,60,225,.3);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:11px;border:0;font:inherit;font-weight:650;
  font-size:.92rem;cursor:pointer;
}
.btn.prim{background:var(--accent);color:#fff;box-shadow:0 3px 14px rgba(108,60,225,.4)}
.btn.prim:active{background:#5b30c4}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:active{background:var(--card2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,84,102,.35)}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

#fab{
  position:fixed;right:18px;bottom:calc(20px + var(--safe-bot));z-index:60;
  padding:14px 20px;border-radius:99px;border:0;background:var(--accent);color:#fff;
  font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  box-shadow:0 6px 22px rgba(108,60,225,.55);
}
#fab:active{transform:scale(.97)}

/* ---------- forms / modal ---------- */
#modalwrap{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(8,6,14,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#modalwrap.open{display:flex;align-items:flex-end;justify-content:center}
#modal{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;padding:18px 18px calc(24px + var(--safe-bot));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#modal{animation:none}}
.mhead{display:flex;align-items:center;margin-bottom:14px}
.mhead h3{font-size:1.05rem;font-weight:700}
.mhead .icobtn{margin-left:auto}
label.f{display:block;color:var(--ink2);font-size:.78rem;font-weight:650;margin:12px 0 5px;letter-spacing:.3px;text-transform:uppercase}
input.f,textarea.f{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;outline:none;
}
input.f:focus,textarea.f:focus{border-color:var(--accent)}
textarea.f{min-height:110px;resize:vertical;line-height:1.5}
.fhint{color:var(--ink3);font-size:.75rem;margin-top:5px}

.coverprev{
  width:80px;height:112px;border-radius:10px;overflow:hidden;border:1px dashed var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:.7rem;text-align:center;
}
.coverprev img{width:100%;height:100%;object-fit:cover}
.coverrow{display:flex;gap:12px;align-items:flex-start}
.ocrstatus{font-size:.78rem;margin-top:8px;color:var(--ink2);min-height:1.2em}
.ocrstatus.busy{color:var(--accent2)}
.ocrstatus.err{color:var(--bad)}
.ocrstatus.ok{color:var(--good)}

#micbtn.rec{background:var(--bad);color:#fff;border-color:transparent;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,84,102,.5)}50%{box-shadow:0 0 0 9px rgba(239,84,102,0)}}
.langtog{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.langtog button{padding:7px 12px;border:0;background:var(--card);color:var(--ink2);font:inherit;font-size:.78rem;font-weight:650;cursor:pointer}
.langtog button.on{background:var(--accent);color:#fff}

/* ---------- flashcards ---------- */
.flash{
  background:var(--card2);border:1px solid var(--accent-soft);border-radius:var(--r);
  padding:22px 16px;min-height:140px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;cursor:pointer;margin-bottom:10px;
}
.flash .side{font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--accent2);text-transform:uppercase;margin-bottom:10px}
.flash .txt{font-size:1.02rem;line-height:1.5}
.grade{display:flex;gap:8px}
.grade .btn{flex:1}
.statline{display:flex;gap:14px;color:var(--ink2);font-size:.8rem;margin-bottom:12px}
.statline b{color:var(--ink)}

/* ---------- coach ---------- */
.prompt{border-left:3px solid var(--accent);padding-left:12px}
.prompt .ptag{font-size:.7rem;font-weight:700;color:var(--accent2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.activity{display:flex;gap:11px;align-items:flex-start}
.activity input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:21px;height:21px;flex:none;margin-top:1px;
  border:1.5px solid var(--ink3);border-radius:7px;cursor:pointer;position:relative;background:transparent;
}
.activity input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.activity input[type=checkbox]:checked::after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.8rem;font-weight:800;
}
.activity.done .notetxt{color:var(--ink3);text-decoration:line-through}

/* ---------- misc ---------- */
.empty{
  text-align:center;padding:48px 24px;color:var(--ink2);
  border:1px dashed var(--line);border-radius:var(--r);
}
.empty .big{font-size:2rem;margin-bottom:10px}
.empty b{color:var(--ink)}
.sechead{display:flex;align-items:baseline;margin:20px 0 10px}
.sechead h3{font-size:.82rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
.sechead span{margin-left:auto;color:var(--ink3);font-size:.75rem}
.toast{
  position:fixed;left:50%;bottom:calc(86px + var(--safe-bot));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--accent);color:var(--ink);
  padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:600;z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,.5);white-space:nowrap;
}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">Lec<b>tor</b></div>
    <div class="hbtns">
      <button class="icobtn" id="togsearch" title="Buscar" aria-label="Buscar">⌕</button>
      <button class="icobtn" id="importbtn" title="Importar JSON" aria-label="Importar JSON">⇪</button>
      <button class="icobtn" id="exportbtn" title="Exportar JSON" aria-label="Exportar JSON">⇩</button>
      <input type="file" id="importfile" accept=".json,application/json" hidden>
    </div>
  </div>
  <div id="searchwrap"><input id="search" type="search" placeholder="Buscar libros, capítulos, notas…" autocomplete="off"></div>
  <nav class="tabs">
    <button data-tab="library" class="on">Biblioteca</button>
    <button data-tab="review">Repaso</button>
    <button data-tab="coach">Coach</button>
  </nav>
</header>

<main id="view"></main>
<button id="fab">＋ Nuevo</button>
<div id="modalwrap"><div id="modal"></div></div>

<script>
"use strict";
/* =========================================================
   Lector — offline reading notes. Single file, no deps
   except Tesseract.js v5 loaded lazily from CDN for OCR.
   ========================================================= */

/* ---------- store ---------- */
const DB_KEY = "rnotes_v1";
const blank = () => ({ books:[], chapters:[], notes:[], cards:[], activities:[] });
let DB = blank();

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) DB = Object.assign(blank(), JSON.parse(raw));
  }catch(e){ console.error("load failed", e); DB = blank(); }
}
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){
    console.error("save failed", e);
    toast("⚠️ Sin espacio en localStorage — exporta y limpia portadas");
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => Date.now();

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("es-GT",{day:"numeric",month:"short"}) + " · " +
         d.toLocaleTimeString("es-GT",{hour:"2-digit",minute:"2-digit"});
}
function parseTags(s){
  return [...new Set(String(s||"").split(/[,#]/).map(t=>t.trim().toLowerCase()).filter(Boolean))];
}
function tagHtml(tags){ return (tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join(""); }
let toastTimer = null;
function toast(msg){
  $(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2400);
}

/* lookups */
const book    = id => DB.books.find(b=>b.id===id);
const chapter = id => DB.chapters.find(c=>c.id===id);
const chaptersOf = bid => DB.chapters.filter(c=>c.bookId===bid).sort((a,b)=>a.createdAt-b.createdAt);
const notesOf    = cid => DB.notes.filter(n=>n.chapterId===cid).sort((a,b)=>b.createdAt-a.createdAt);
const notesOfBook= bid => DB.notes.filter(n=>n.bookId===bid);

/* ---------- navigation ---------- */
const nav = { tab:"library", bookId:null, chapterId:null, searching:false };
function go(patch){ Object.assign(nav, patch); render(); }

$$("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  $$("nav.tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  go({ tab:b.dataset.tab, bookId:null, chapterId:null });
}));

$("#togsearch").addEventListener("click", () => {
  const w = $("#searchwrap");
  w.classList.toggle("open");
  nav.searching = w.classList.contains("open");
  if(nav.searching){ $("#search").focus(); } else { $("#search").value=""; }
  render();
});
$("#search").addEventListener("input", render);

/* ---------- render dispatch ---------- */
function render(){
  const v = $("#view");
  const q = nav.searching ? $("#search").value.trim().toLowerCase() : "";
  if(q){ v.innerHTML = renderSearch(q); bindView(); return; }
  if(nav.tab==="library"){
    if(nav.chapterId)      v.innerHTML = renderChapter(nav.chapterId);
    else if(nav.bookId)    v.innerHTML = renderBook(nav.bookId);
    else                   v.innerHTML = renderLibrary();
  }
  else if(nav.tab==="review") v.innerHTML = renderReview();
  else                        v.innerHTML = renderCoach();
  updateFab();
  bindView();
}

function updateFab(){
  const f = $("#fab");
  if(nav.tab!=="library"){ f.style.display="none"; return; }
  f.style.display="block";
  f.textContent = nav.chapterId ? "＋ Nota" : nav.bookId ? "＋ Capítulo" : "＋ Libro";
}
$("#fab").addEventListener("click", () => {
  if(nav.chapterId)   noteForm();
  else if(nav.bookId) chapterForm();
  else                bookForm();
});

/* ---------- views ---------- */
function renderLibrary(){
  if(!DB.books.length) return `
    <div class="empty"><div class="big">📚</div>
      <b>Tu biblioteca está vacía.</b><br>
      Toca <b>＋ Libro</b> para agregar el primero.<br>
      Puedes escanear la portada y el OCR llenará título y autor.
    </div>`;
  const cards = DB.books.slice().sort((a,b)=>b.createdAt-a.createdAt).map(b=>{
    const ch = chaptersOf(b.id).length, nn = notesOfBook(b.id).length;
    const cov = b.cover ? `<img src="${b.cover}" alt="">` : esc((b.title||"?")[0].toUpperCase());
    return `<div class="card tap bookcard" data-open-book="${b.id}">
      <div class="cover">${cov}</div>
      <div class="bmeta">
        <div class="btitle">${esc(b.title)}</div>
        <div class="bauthor">${esc(b.author||"Autor desconocido")}</div>
        <div class="bcount">${ch} capítulos · ${nn} notas</div>
      </div><div class="chev">›</div></div>`;
  }).join("");
  return `<h2 class="vtitle">Biblioteca</h2><p class="vsub">${DB.books.length} libros</p>${cards}`;
}

function renderBook(bid){
  const b = book(bid); if(!b){ nav.bookId=null; return renderLibrary(); }
  const chs = chaptersOf(bid);
  const list = chs.length ? chs.map((c,i)=>`
    <div class="card tap" data-open-chapter="${c.id}">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="color:var(--accent2);font-weight:800;font-size:.8rem;min-width:24px">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="btitle">${esc(c.title)}</div>
          <div class="bcount">${notesOf(c.id).length} notas</div>
        </div><div class="chev">›</div>
      </div></div>`).join("")
    : `<div class="empty"><div class="big">📑</div><b>Sin capítulos.</b><br>Toca <b>＋ Capítulo</b> para empezar.</div>`;
  return `
    <div class="crumb"><button data-nav-lib>‹ Biblioteca</button></div>
    <div class="bookcard" style="margin-bottom:14px">
      <div class="cover" style="width:64px;height:90px">${b.cover?`<img src="${b.cover}" alt="">`:esc((b.title||"?")[0].toUpperCase())}</div>
      <div class="bmeta">
        <h2 class="vtitle" style="margin:0">${esc(b.title)}</h2>
        <p class="vsub" style="margin:2px 0 0">${esc(b.author||"")}</p>
        ${b.desc?`<div class="bcount">${esc(b.desc)}</div>`:""}
      </div>
    </div>
    <div class="rowbtns" style="margin-bottom:14px">
      <button class="btn ghost sm" data-edit-book="${b.id}">Editar</button>
      <button class="btn danger sm" data-del-book="${b.id}">Eliminar libro</button>
    </div>
    <div class="sechead"><h3>Capítulos</h3><span>${chs.length}</span></div>${list}`;
}

function renderChapter(cid){
  const c = chapter(cid); if(!c){ nav.chapterId=null; return renderBook(nav.bookId); }
  const b = book(c.bookId);
  const ns = notesOf(cid);
  const list = ns.length ? ns.map(noteCard).join("")
    : `<div class="empty"><div class="big">✏️</div><b>Sin notas en este capítulo.</b><br>Toca <b>＋ Nota</b> — escribe, dicta por voz, o ambas.</div>`;
  return `
    <div class="crumb">
      <button data-nav-lib>Biblioteca</button><span class="sep">›</span>
      <button data-nav-book="${b.id}">${esc(b.title)}</button>
    </div>
    <h2 class="vtitle">${esc(c.title)}</h2>
    <p class="vsub">${ns.length} notas</p>
    <div class="rowbtns" style="margin-bottom:14px">
      <button class="btn danger sm" data-del-chapter="${c.id}">Eliminar capítulo</button>
    </div>${list}`;
}

function noteCard(n, withSrc){
  const c = chapter(n.chapterId), b = book(n.bookId);
  return `<div class="card">
    <div class="notetxt">${esc(n.text)}</div>
    ${withSrc && b ? `<div class="notesrc">${esc(b.title)} › ${esc(c?c.title:"")}</div>`:""}
    <div class="notemeta">${tagHtml(n.tags)}<span class="stamp">${fmt(n.createdAt)}</span></div>
    <div class="rowbtns">
      <button class="btn ghost sm" data-card-from="${n.id}">⚡ Flashcard</button>
      <button class="btn ghost sm" data-edit-note="${n.id}">Editar</button>
      <button class="btn danger sm" data-del-note="${n.id}">Eliminar</button>
    </div></div>`;
}

/* ---------- search ---------- */
function renderSearch(q){
  const hit = s => String(s||"").toLowerCase().includes(q);
  const bs = DB.books.filter(b=>hit(b.title)||hit(b.author)||hit(b.desc));
  const cs = DB.chapters.filter(c=>hit(c.title));
  const ns = DB.notes.filter(n=>hit(n.text)||(n.tags||[]).some(t=>t.includes(q)));
  if(!bs.length && !cs.length && !ns.length)
    return `<div class="empty"><div class="big">⌕</div><b>Sin resultados para “${esc(q)}”.</b></div>`;
  let h = "";
  if(bs.length){
    h += `<div class="sechead"><h3>Libros</h3><span>${bs.length}</span></div>`;
    h += bs.map(b=>`<div class="card tap" data-open-book="${b.id}"><div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author||"")}</div></div>`).join("");
  }
  if(cs.length){
    h += `<div class="sechead"><h3>Capítulos</h3><span>${cs.length}</span></div>`;

const COACH_RULES = [

    prompts:[

      "Reescribe la cita «{snippet}» en lenguaje moderno y directo.",

    activity:"Convierte la pregunta en una flashcard: pregunta al frente, tu mejor respuesta atrás." },
  { match:["vocab","vocabulario","palabra","término","termino"], label:"Vocabulario",
    prompts:[
      "Usa la palabra de «{snippet}» en 3 frases nuevas, una sobre tu negocio.",
      "Define el término sin diccionario. Luego verifica.",
      "¿Hay un equivalente en inglés/español? ¿Cambia el matiz?"
    ],
    activity:"Crea una flashcard de vocabulario: término al frente, definición + ejemplo atrás." },
  { match:["acción","accion","action","aplicar","hábito","habito","todo"], label:"Acción",
    prompts:[
      "¿Cuál es el paso más pequeño que puedes dar HOY basado en «{snippet}»?",
      "¿Qué te detendría de aplicar esto? Nombra el obstáculo real.",
      "Define cuándo y dónde lo harás. Sin fecha y lugar no es un plan."
    ],
    activity:"Ejecuta la acción de esta nota en las próximas 24 h y anota el resultado en {book}." },
  { match:["resumen","summary"], label:"Resumen",
    prompts:[
      "Comprime tu resumen «{snippet}» a una sola frase. ¿Qué sobrevive?",
      "¿Qué dejó fuera tu resumen que el autor consideraría esencial?"
    ],
    activity:"Explica el capítulo «{chapter}» en voz alta durante 60 segundos, sin notas." }
];
const COACH_GENERIC = {
  label:"Reflexión",
  prompts:[
    "Releé esta nota: «{snippet}». ¿Sigue pareciéndote importante? ¿Por qué?",
    "¿Cómo se conecta esta nota con otra cosa que hayas leído en {book} u otro libro?",
    "Si solo pudieras conservar una idea de «{chapter}», ¿sería esta? ¿Qué la supera?"
  ],
  activity:"Agrega un tag a esta nota (#idea, #cita, #pregunta, #accion) para que el coach te dé mejores prompts."
};
const pick = a => a[Math.floor(Math.random()*a.length)];
function fill(t, n){
  const b = book(n.bookId), c = chapter(n.chapterId);
  const snip = n.text.length>90 ? n.text.slice(0,90)+"…" : n.text;
  return t.replaceAll("{snippet}",snip).replaceAll("{book}",b?b.title:"tu libro").replaceAll("{chapter}",c?c.title:"el capítulo");
}
function coachGenerate(){
  const pool = DB.notes.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,12);
  const out = [];
  for(const n of pool){
    const rule = COACH_RULES.find(r => (n.tags||[]).some(t => r.match.includes(t))) || COACH_GENERIC;
    out.push({ noteId:n.id, label:rule.label, prompt:fill(pick(rule.prompts),n), activity:fill(rule.activity,n) });
    if(out.length>=5) break;
  }
  return out;
}
let coachCache = null;
function renderCoach(){
  let h = `<h2 class="vtitle">Coach</h2><p class="vsub">Prompts de reflexión generados desde los tags de tus notas. 100% offline, sin IA.</p>`;

  }
  h += `<button class="btn prim wide" data-coach-gen>🎲 Generar prompts</button>`;
  if(coachCache){
    h += coachCache.map((p,i)=>`
      <div class="card prompt" style="margin-top:10px">

      </div>`).join("");

  const acts = DB.activities.slice().sort((a,b)=> (a.done-b.done) || b.createdAt-a.createdAt);
  h += `<div class="sechead"><h3>Actividades</h3><span>${acts.filter(a=>!a.done).length} pendientes</span></div>`;
  h += acts.length ? acts.map(a=>`

    : `<div class="empty" style="padding:26px"><b>Sin actividades.</b><br>Genera prompts arriba y convierte los mejores en actividades.</div>`;
  return h;
}

async function onCoverPicked(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const status = $("#ocrstatus");
  // thumbnail for storage (small, localStorage budget) + full-res for OCR
  const fullURL = URL.createObjectURL(file);
  try{
    const img = await loadImg(fullURL);
    pendingCover = thumb(img, 240);
    $("#coverprev").innerHTML = `<img src="${pendingCover}" alt="">`;
    status.className = "ocrstatus busy"; status.textContent = "Cargando OCR…";
    const text = await runOCR(img, p => { status.textContent = "Leyendo portada… " + Math.round(p*100) + "%"; });
    const {title, author} = parseCover(text);
    if(title && !$("#f_title").value)  $("#f_title").value  = title;
    if(author && !$("#f_author").value) $("#f_author").value = author;
    status.className = "ocrstatus ok";
    status.textContent = title ? "OCR listo — revisa y corrige." : "OCR terminó pero no detectó texto claro. Escribe manualmente.";
  }catch(err){
    console.error(err);
    status.className = "ocrstatus err";
    status.textContent = "OCR falló (¿sin internet para el modelo?). La portada se guardó; escribe título y autor.";
  }finally{
    URL.revokeObjectURL(fullURL);
    e.target.value = "";
  }
}
function loadImg(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
function thumb(img, w){
  const sc = w / img.naturalWidth;
  const c = document.createElement("canvas");
  c.width = w; c.height = Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", .72);
}

/* Tesseract v5, lazy-loaded, Spanish */
let tessWorkerP = null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script load failed: "+src));
    document.head.appendChild(s);
  });
}
async function getTess(progressCb){
  if(!tessWorkerP){
    tessWorkerP = (async ()=>{
      if(!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
      return Tesseract.createWorker("spa", 1, {
        logger: m => { if(m.status==="recognizing text" && progressCb) progressCb(m.progress); }
      });
    })().catch(e=>{ tessWorkerP=null; throw e; });
  }
  return tessWorkerP;
}
async function runOCR(img, progressCb){
  const worker = await getTess(progressCb);
  // downscale very large photos for speed
  let src = img;
  if(img.naturalWidth > 1200){
    const c=document.createElement("canvas");
    const sc=1200/img.naturalWidth;
    c.width=1200; c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    src=c;
  }
  const {data} = await worker.recognize(src);
  return data.text || "";
}
function parseCover(text){
  const lines = text.split("\n").map(l=>l.replace(/[^\p{L}\p{N} .,'’:¡!¿?-]/gu," ").trim())
                    .filter(l => l.length>=3 && /\p{L}{3}/u.test(l));
  if(!lines.length) return {title:"",author:""};
  // title = longest line in the top half; author = line starting with "por"/"by", else next-longest other line
  const half = lines.slice(0, Math.max(2, Math.ceil(lines.length/1.5)));
  const maxLen = Math.max(...half.map(l=>l.length));
  // covers print the title in caps above everything else; fall back to first long line
  const caps = half.find(l => l === l.toUpperCase() && /\p{L}{3}/u.test(l) && l.length >= Math.min(8, maxLen*0.4));
  const title = caps || half.find(l => l.length >= maxLen*0.8) || half[0];
  let author = "";
  const byLine = lines.find(l=>/^(por|by)\s+/i.test(l));
  if(byLine) author = byLine.replace(/^(por|by)\s+/i,"");
  else {
    const cand = lines.filter(l=>l!==title && l.split(" ").length<=5 && l.length<=40);
    author = cand.sort((a,b)=>b.length-a.length)[0] || "";
  }
  const tidy = s => s.toLowerCase().replace(/\b\p{L}/gu, c=>c.toUpperCase()).trim();
  return { title: tidy(title), author: tidy(author) };
}

/* Web Speech API — needs HTTPS + network on iOS (Apple routes recognition through its servers) */
let rec = null, recOn = false;
function setupVoice(target){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("#micbtn"), hint = $("#michint");
  if(!SR){ btn.disabled = true; hint.textContent = "Dictado no soportado en este navegador."; return; }
  btn.addEventListener("click", ()=>{
    if(recOn){ stopVoice(); return; }
    rec = new SR();
    rec.lang = voiceLang;
    rec.continuous = true;
    rec.interimResults = true;
    let base = target.value;
    rec.onresult = ev => {
      let fin = "", interim = "";
      for(let i=0;i<ev.results.length;i++){
        const r = ev.results[i];
        if(r.isFinal) fin += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      target.value = (base + (base&&fin?" ":"") + fin + interim).trimStart();
    };
    rec.onerror = e => { hint.textContent = "Error de dictado: " + e.error + (e.error==="network"?" — el dictado de iOS requiere internet.":""); stopVoice(); };
    rec.onend = () => stopVoice();
    try{
      rec.start(); recOn = true;
      btn.classList.add("rec"); btn.textContent = "■ Detener";
      hint.textContent = "Escuchando ("+voiceLang+")…";
    }catch(e){ hint.textContent = "No se pudo iniciar el micrófono."; }
  });
}
function stopVoice(){
  if(rec){ try{rec.stop();}catch(e){} rec=null; }
  recOn = false;
  const btn = $("#micbtn"), hint = $("#michint");
  if(btn){ btn.classList.remove("rec"); btn.textContent = "🎙 Dictar"; }
  if(hint && hint.textContent.startsWith("Escuchando")) hint.textContent = "";
}

$("#importbtn").addEventListener("click", ()=>$("#importfile").click());
$("#importfile").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.books) || !Array.isArray(data.notes)) throw new Error("estructura inválida");
      if(!confirm(`Importar ${data.books.length} libros y ${data.notes.length} notas. Esto REEMPLAZA los datos actuales. ¿Continuar?`)) return;
      DB = Object.assign(blank(), {
        books:data.books, chapters:data.chapters||[], notes:data.notes,
        cards:data.cards||[], activities:data.activities||[]
      });
      save(); coachCache=null; go({tab:"library", bookId:null, chapterId:null});
      toast("Backup importado");
    }catch(err){
      console.error(err);
      toast("⚠️ JSON inválido — usa un backup exportado por Lector");
    }finally{ e.target.value=""; }
  };
  reader.readAsText(file);
});

/* ---------- delegated events ---------- */
function bindView(){ /* delegation handles everything; kept for symmetry */ }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open-book],[data-open-chapter],[data-nav-lib],[data-nav-book],[data-edit-book],[data-del-book],[data-del-chapter],[data-edit-note],[data-del-note],[data-card-from],[data-flip],[data-grade],[data-coach-gen],[data-add-act],[data-act-tog],[data-del-act],[data-close]");
  if(!t) return;
  const d = t.dataset;
  if(d.close !== undefined){ closeModal(); return; }
  if(d.openBook){ $("#searchwrap").classList.remove("open"); nav.searching=false; $("#search").value=""; setTab("library"); go({tab:"library", bookId:d.openBook, chapterId:null}); return; }
  if(d.openChapter){ const c=chapter(d.openChapter); $("#searchwrap").classList.remove("open"); nav.searching=false; $("#search").value=""; setTab("library"); go({tab:"library", bookId:c.bookId, chapterId:c.id}); return; }
  if(d.navLib !== undefined){ go({bookId:null, chapterId:null}); return; }
  if(d.navBook){ go({bookId:d.navBook, chapterId:null}); return; }
  if(d.editBook){ bookForm(book(d.editBook)); return; }
  if(d.delBook){
    if(!confirm("¿Eliminar libro, sus capítulos y notas?")) return;
    const bid = d.delBook;
    const chIds = chaptersOf(bid).map(c=>c.id);
    const nIds  = DB.notes.filter(n=>n.bookId===bid).map(n=>n.id);
    DB.books    = DB.books.filter(b=>b.id!==bid);
    DB.chapters = DB.chapters.filter(c=>c.bookId!==bid);
    DB.notes    = DB.notes.filter(n=>n.bookId!==bid);
    DB.cards    = DB.cards.filter(k=>!nIds.includes(k.noteId));
    save(); go({bookId:null, chapterId:null}); toast("Libro eliminado"); return;
  }
  if(d.delChapter){
    if(!confirm("¿Eliminar capítulo y sus notas?")) return;
    const cid = d.delChapter;
    const nIds = notesOf(cid).map(n=>n.id);
    DB.chapters = DB.chapters.filter(c=>c.id!==cid);
    DB.notes    = DB.notes.filter(n=>n.chapterId!==cid);
    DB.cards    = DB.cards.filter(k=>!nIds.includes(k.noteId));
    save(); go({chapterId:null}); toast("Capítulo eliminado"); return;
  }
  if(d.editNote){ const n=DB.notes.find(x=>x.id===d.editNote); nav.bookId=n.bookId; nav.chapterId=n.chapterId; noteForm(n); return; }
  if(d.delNote){
    if(!confirm("¿Eliminar nota?")) return;
    DB.notes = DB.notes.filter(n=>n.id!==d.delNote);
    DB.cards = DB.cards.filter(k=>k.noteId!==d.delNote);
    save(); render(); toast("Nota eliminada"); return;
  }
  if(d.cardFrom){ cardForm(d.cardFrom); return; }
  if(d.flip){
    const k = DB.cards.find(x=>x.id===d.flip);
    const flipped = t.dataset.flipped === "1";
    $("#studyzone").innerHTML = studyHtml(k, !flipped); return;
  }
  if(d.grade){ grade(d.cid, d.grade); return; }
  if(d.coachGen !== undefined){ coachCache = coachGenerate(); render(); return; }
  if(d.addAct !== undefined){
    const p = coachCache && coachCache[+d.addAct]; if(!p) return;
    DB.activities.push({id:uid(), text:p.activity, tag:p.label.toLowerCase(), done:false, createdAt:now()});
    save(); render(); toast("Actividad agregada"); return;
  }
  if(d.actTog){
    const a = DB.activities.find(x=>x.id===d.actTog);
    if(a){ a.done = !a.done; save(); render(); } return;
  }
  if(d.delAct){
    DB.activities = DB.activities.filter(x=>x.id!==d.delAct);
    save(); render(); return;
  }
});
function setTab(name){
  $$("nav.tabs button").forEach(x=>x.classList.toggle("on", x.dataset.tab===name));
  nav.tab = name;
}

/* ---------- init ---------- */
load();
render();
</script>
</body>
</html>
